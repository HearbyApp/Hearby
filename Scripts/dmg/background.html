<!DOCTYPE html>
<!--
  Background of the Hearby.dmg window, 660 x 400 points. The two icons are
  placed by create-dmg in Scripts/release.sh at (165, 205) and (495, 205);
  the arrow and text here are drawn around those positions.
  Regenerate both PNGs after editing:  Scripts/dmg/render.sh
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 660px; height: 400px; overflow: hidden; }
  body {
    background: linear-gradient(#fbfbfc, #eef0f3);
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    color: #1d1d1f;
    position: relative;
  }
  h1 {
    position: absolute; top: 34px; left: 0; right: 0; margin: 0;
    text-align: center; font-size: 22px; font-weight: 600; letter-spacing: -0.2px;
  }
  p {
    position: absolute; left: 0; right: 0; margin: 0;
    text-align: center; font-size: 13px; color: #6e6e73;
  }
  .sub { top: 68px; }
  .foot { bottom: 30px; }
  svg { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
  <h1>Drag Hearby to Applications</h1>
  <p class="sub">Drop the Hearby icon onto the Applications folder.</p>
  <svg width="660" height="400" viewBox="0 0 660 400">
    <path d="M 262 205 L 386 205" stroke="#8e8e93" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 372 189 L 392 205 L 372 221" stroke="#8e8e93" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </svg>
  <p class="foot">Then open Hearby from Applications. It lives in your menu bar.</p>
</body>
</html>
