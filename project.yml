# XcodeGen project spec — run `xcodegen` in this directory to produce Hearby.xcodeproj
# Install XcodeGen with: brew install xcodegen
name: Hearby
options:
  bundleIdPrefix: app.hearby
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

# Vendored local package (sherpa-onnx 1.13.2). The upstream remote package
# (willwade/sherpa-onnx-spm) is broken for Xcode builds at every published
# tag — see Vendor/SherpaOnnx/README.md for details and regeneration steps.
packages:
  SherpaOnnx:
    path: Vendor/SherpaOnnx
  # Auto-update for direct (non-App-Store) distribution. Sparkle only
  # installs updates whose EdDSA signature matches SUPublicEDKey below AND
  # whose Developer ID signature matches the running app, so both the feed
  # and the download can be served over untrusted infrastructure.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0

targets:
  Hearby:
    type: application
    platform: macOS
    sources:
      - path: Hearby
      # GPLv3 requires the license to travel with every copy of the app; the
      # menu's "License" button opens the bundled file.
      - path: LICENSE
        buildPhase: resources
      - path: THIRD-PARTY-NOTICES.md
        buildPhase: resources
    # Regenerate with ./Scripts/make-icon.swift — the icon is drawn in code,
    # not kept as a binary design asset.
    dependencies:
      - package: SherpaOnnx
        product: SherpaOnnx
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_NAME: Hearby
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "5.9"
        # Universal: the vendored xcframework carries a macos-arm64_x86_64
        # slice, so Intel support costs nothing but build time.
        ARCHS: "$(ARCHS_STANDARD)"
        # Signed with a stable identity, NOT ad-hoc. TCC pins an ad-hoc
        # grant to the binary's cdhash, so Accessibility permission silently
        # broke on every rebuild. An identity-based signature keeps the grant
        # valid across rebuilds. For distribution, Scripts/release.sh
        # re-signs with your Developer ID.
        # Manual, not Automatic: automatic provisioning on macOS searches for
        # a "Mac Development" cert and won't match the universal "Apple
        # Development" one. Naming the identity outright skips that lookup.
        # No provisioning profile is needed for a locally-run, non-sandboxed app.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        # Team ID is the cert's OU,
        # NOT the identifier in the cert's common name.
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
        # Notarization requires the hardened runtime — enabling it now keeps
        # dev and release builds identical.
        ENABLE_HARDENED_RUNTIME: true
        # Sandbox is OFF for now (simplest dev experience). The code is
        # sandbox-compatible (network download + /usr/bin/tar into the app
        # container work sandboxed) — flip this on + add entitlements for a
        # future Mac App Store build.
        ENABLE_APP_SANDBOX: false
      configs:
        # Debug stays single-arch so incremental builds don't pay for a
        # second slice; Release ships both.
        debug:
          ONLY_ACTIVE_ARCH: true
        release:
          ONLY_ACTIVE_ARCH: false
    info:
      path: Hearby/Info.plist
      properties:
        # Menu-bar-only app: no Dock icon, no main window.
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright © 2026 Justin Brundage. Open source under the GNU GPL v3 or later."
        # xcodegen rewrites Info.plist from this block on every run, so the
        # version keys have to live here — editing the plist by hand is lost
        # on the next `xcodegen`. These indirect to the build settings above
        # so MARKETING_VERSION stays the single source of truth.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # An .icns in Resources/, not an asset catalog — one generated file
        # instead of a directory tree of PNGs.
        CFBundleIconFile: AppIcon
        # ── Sparkle auto-update ───────────────────────────────────────────
        # Appcast is published as an asset on each GitHub release;
        # /releases/latest/download/ always resolves to the newest one.
        # The owner is baked into every shipped copy: moving the repository
        # strands existing installs on their current version.
        SUFeedURL: "https://github.com/HearbyApp/Hearby/releases/latest/download/appcast.xml"
        # Public half of the EdDSA pair generated by Sparkle's generate_keys.
        # The private half is in the release machine's login Keychain and must
        # never be committed. Regenerating it invalidates every shipped app's
        # ability to update, so back up the Keychain item.
        SUPublicEDKey: "wQlKkb3TcH6tx2mAqYmfWX5DRjH8R4wfR975HAsiRPA="
        SUEnableAutomaticChecks: true
        # Daily. Sparkle spreads checks out; this is not a fixed 24h alarm.
        SUScheduledCheckInterval: 86400
        # Shown in the Accessibility permission prompt. Without it macOS
        # shows only the bundle name with no explanation of why.
        NSAppleEventsUsageDescription: "Hearby reads the text you have selected so it can speak it aloud."
        # ── The right-click Services entry ─────────────────────────────────
        # This is what makes "Speak Selection" appear in the right-click menu
        # (under Services) of nearly every macOS app when text is selected.
        NSServices:
          - NSMenuItem:
              default: "Speak Selection"
            NSMessage: speakSelectedText        # -> speakSelectedText:userData:error:
            NSPortName: Hearby          # must match PRODUCT_NAME
            # No NSKeyEquivalent here: service shortcuts are unreliable (pbs
            # caching, often need a logout) and never reach Electron apps.
            # Global hotkeys ⌃⌥S / ⌃⌥X are registered in-app instead
            # (HotKeys.swift) and work everywhere.
            NSSendTypes:
              - NSStringPboardType
            NSRequiredContext: {}
          - NSMenuItem:
              default: "Stop Speaking"
            NSMessage: stopSpeaking
            NSPortName: Hearby
            NSSendTypes:
              - NSStringPboardType
            NSRequiredContext: {}

  HearbyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Hearby
    settings:
      base:
        SWIFT_VERSION: "5.9"
        # Test bundles need a plist to be signed; let Xcode synthesize one
        # rather than checking in a file nobody will ever read.
        GENERATE_INFOPLIST_FILE: true
        # Inherits the app's signing identity; no separate profile needed.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""

schemes:
  Hearby:
    build:
      targets:
        Hearby: all
        HearbyTests: [test]
    test:
      targets:
        - HearbyTests
